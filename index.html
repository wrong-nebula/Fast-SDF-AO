uniform float blendK;
// Octahedral normal decode without normalize() for fast dot-product threshold tests.
vec3 octDecodeRaw(vec2 e){
  e=e*2.-1.;

// The traced AO at this pixel, from the AO-resolution result: its four nearest texels weighted bilinearly
// with view-space tangent-plane distance rejection reconstructed from viewDepth (zero extra texture fetches).
// Returns vec3(aoMean, frames, variance). For young noisy histories (frames < 6), applies a lightweight
// 4-neighbor cross-bilateral prefilter with identical plane/normal rejection.
vec3 tracedAt(vec3 pWorld,vec3 n){
  vec2 res=vec2(textureSize(aoTex,0));
  vec2 invRes2=2./res;
  vec2 f=gl_FragCoord.xy*res/vec2(${W}.,${H}.)-.5;
  f=mix(f,round(f),vec2(lessThan(abs(f-round(f)),vec2(.02))));

    if(bw<1e-4)continue;

    float sig=hn.z*.25;
    acc+=bw*vec3(h.x,frames,sig*sig);ws+=bw;

  if(resVal.y<6.&&resVal.z>.003){
    ivec2 c0=clamp(ivec2(round(f)),ivec2(0),ivec2(res)-1);
    float fSum=resVal.x*2.,fw=2.;
    const ivec2 offs[4]=ivec2[4](ivec2(-1,0),ivec2(1,0),ivec2(0,-1),ivec2(0,1));
    for(int k=0;k<4;k++){
      ivec2 q=clamp(c0+offs[k],ivec2(0),ivec2(res)-1);
      vec2 h=texelFetch(aoTex,q,0).xy;
      vec4 hn=texelFetch(aoNormalTex,q,0);
      if(hn.w*255.<.5||abs(h.y-viewDepth)>depthTol)continue;
      vec3 nv=octDecodeRaw(hn.xy);float dn=dot(nv,n);
      if(dn<=0.||dn*dn<.81*dot(nv,nv))continue;
      vec2 ndcQ=(vec2(q)+.5)*invRes2-1.;
      if(abs((dot(vnXY,ndcQ)-vn.z)*h.y-vpDotN)>planeTol)continue;
      fSum+=h.x;fw+=1.;
    }
    resVal.x=fSum/fw;
  }
  return resVal;
}

vec3 ycocgToLinear(vec3 c){

      float bw=(o.x==1?w.x:1.-w.x)*(o.y==1?w.y:1.-w.y);

      if(sc<bestScore){bestScore=sc;bestGIQ=q;bestN=nv*invNl;}
      if(bw<1e-4||abs(h.y-viewDepth)>depthTol)continue;
      if(dn<=0.||dn*dn<.81*nv2)continue;

      sh0Acc+=bw*texelFetch(aoGITex,q,0).rgb;
      nAcc+=bw*(nv*invNl);
      ws+=bw;
    }

      sh0=texelFetch(aoGITex,bestGIQ,0).rgb;nC=bestN;aoTr=vec3(0.);

  {

    vec2 f=(gl_FragCoord.xy*vec2(resAO)/vec2(${W}.,${H}.)-.5)/vec2(giStride);

    for(int k=0;k<4;k++){

      ivec2 gq=clamp(q*giStride,ivec2(0),resAO-1);
      float bw=(o.x==1?w.x:1.-w.x)*(o.y==1?w.y:1.-w.y);
      vec2 h=texelFetch(aoTex,gq,0).xy;

      if(h.y<=0.)continue;

      if(sc<bestScore){bestScore=sc;bestGIQ=q;bestN=nv*invNl;}
      if(bw<1e-4||hn.w*255.<.5||abs(h.y-viewDepth)>depthTol)continue;
      if(dn<=0.||dn*dn<.78*nv2)continue;
      vec2 ndcQ=(vec2(gq)+.5)*invResAO2-1.;
      if(abs((dot(vnXY,ndcQ)-vn.z)*h.y-vpDotN)>planeTol)continue;
      sh0Acc+=bw*texelFetch(aoGITex,q,0).rgb;
      nAcc+=bw*(nv*invNl);
      ws+=bw;
    }
    if(ws<=.01){
      sh0=texelFetch(aoGITex,bestGIQ,0).rgb;nC=bestN;
    }else{
      sh0=sh0Acc/ws;nC=nAcc/ws;
    }
  }
  #endif
  // 1 single RGBA8 fetch for scale-invariant dominant GI direction d1 = c1 / Y in [-1, 1]^3:
  // white-furnace-preserving L1 YCoCg SH normal resolve against full-res normal n!
  vec3 d1=texelFetch(aoGISH1Tex,bestGIQ,0).rgb*2.-1.;
  float y0=max(sh0.x,0.);
  float nlC=length(nC);
  vec3 nCoarse=nlC>1e-4?nC/nlC:n;
  float yFull=max(0.,.333333+dot(d1,n));
  float yBase=max(.08,.333333+dot(d1,nCoarse));

  vec2 chroma=sh0.yz*((yOut+1e-4)/(y0+1e-4));

}

// Jimenez 2016 Multi-Bounce Colored AO approximation
vec3 multiBounceAO(float ao,vec3 albedo){
  vec3 a=2.0404*albedo-.3324;
  vec3 b=-4.7951*albedo+.6417;
  vec3 c=2.7552*albedo+.6903;
  return max(vec3(ao),((ao*a+b)*ao+c)*ao);
}

float specularOcclusion(float NoV,float ao,float roughness){

float sdfSunShadow(vec3 pos,vec3 nor,vec3 sDir){
  vec3 ro=pos+nor*.03+sDir*.02;
  float ndl=max(dot(nor,sDir),.15);
  float t=.02,res=1.;
  for(int s=0;s<68;s++){
    float d=staticDistance(ro+sDir*t);
    if(d>100.)break;
    float tol=min(.012,.22*t*ndl);
    float dc=d-tol;
    if(dc<=0.)return 0.;
    res=min(res,8.*dc/t);
    if(res<.005)return 0.;
    float stepMul=mix(.4,.8,smoothstep(.40,.85,d));
    t+=max(d*stepMul,.012);
    if(t>10.5)break;
  }
  res=clamp(res,0.,1.);
  return res*res*(3.-2.*res);
}

    res=(nl*acos(arg)-sqrt(k2*(h2-1.)))/h2+atan(sqrt(k2/(h2-1.)));

bool rayHitsMover(int idx,vec3 p,vec3 w){

      sdfUniforms.sceneId.value=0;
      sdfUniforms.sunDir.value.copy(DEFAULT_SUN_DIR);
      camera.position.set(18,-4,7.3);
      controls.target.set(10.8,8.8,1.4);
      controls.update();
      rebuildStaticContact([mesh],{gridSize:'auto',range:contactRange,bias:.0003});
      giMode.value=false;giCheckbox.checked=false;
      multiBounceGI.value=false;multiBounceCheckbox.checked=false;
      emissiveMode.value=false;emissiveCheckbox.checked=false;
      sdfUniforms.emissiveColor.value.set(0,0,0);emissiveOrbMesh.visible=false;
      giMask.value=false;giMaskCheckbox.checked=false;
    }
    lastCamera.identity();
    giGTargetValid=false;
    updateStatus();
    resetFps();
  }
  buttons.forEach(button=>button.onclick=()=>select(Number(button.dataset.taps)));
  sceneButtons.forEach(button=>button.onclick=()=>setScene(button.dataset.scene));
  document.querySelector('#mask').onchange=event=>{mask.value=event.target.checked;resetFps();};
  document.querySelector('#animate').onchange=event=>{animate=event.target.checked;};
  document.querySelector('#dynao').onchange=event=>{dynamicAO=event.target.checked;updateMovers(simTime);resetFps();};
  document.querySelector('#forcemesh').onchange=event=>{forceMesh=event.target.checked;if(forceMesh)ensureAllBaked();updateMovers(simTime);resetFps();};
  document.querySelector('#hizcontact').onchange=event=>{traced.contactMode.value=event.target.checked?1:0;traced.frame.value=0;resetHistory();resetFps();};
  document.querySelector('#pbr').onchange=event=>{pbrMode.value=event.target.checked;traced.frame.value=0;resetHistory();resetFps();};
  document.querySelector('#smoothfalloff').onchange=event=>{traced.smoothFalloff.value=event.target.checked?1:0;traced.frame.value=0;resetHistory();resetFps();};
  giCheckbox.onchange=event=>setGI(event.target.checked);
  multiBounceCheckbox.onchange=event=>setMultiBounceGI(event.target.checked);
  emissiveCheckbox.onchange=event=>setEmissive(event.target.checked);
  giMaskCheckbox.onchange=event=>setGIMask(event.target.checked);
  sunAngleInput.oninput=event=>setSunAngle(Number(event.target.value));
  qualitySelect.onchange=event=>setQuality(event.target.value);
  // Debug hook for timing from the console.
  window.aoDemo={scene,mesh,get atriumMesh(){return atriumMesh;},get galleryMesh(){return galleryMesh;},get sceneName(){return activeScene;},get radianceGrid(){return radianceGrids[activeScene];},setScene,boxes,T,aoPass,aoPassBent,aoPassGI,field,get activeField(){return sdfUniforms.field.value;},get contactResources(){return contactResources;},rebuildStaticContact,renderer,camera,controls,render,updateMovers,dyn,movers,bakeMs,bakeSyncMs,bakeGpuMs,totalTris,get atlas(){return baked.tex;},meshRes:MESH_RES,setMask:on=>{mask.value=on;},setPBR:on=>{pbrMode.value=on;traced.frame.value=0;resetHistory();},setGI,setMultiBounceGI,setEmissive,setEmissiveTime,setGIMask,setSunAngle,get sunDir(){return sdfUniforms.sunDir.value.toArray();},setSmoothFalloff:on=>{traced.smoothFalloff.value=on?1:0;traced.frame.value=0;resetHistory();},setMoverScale:(x,y=x,z=x,w=x)=>dyn.moverScale.value.set(x,y,z,w),select:mode=>select(mode),
    setDynamicAO:on=>{dynamicAO=on;updateMovers(simTime);},setContactMode:mode=>{traced.contactMode.value=Number(mode)||0;traced.frame.value=0;resetHistory();},traced,
    resetHistory,resetGIHistory,
    QUALITY_PRESETS,setQuality,get quality(){return qualityTier;},
    setAOScale:scale=>{aoScale=scale;makeTracedTargets(scale);},
    setGIScale:scale=>{if(Math.abs(giScale-scale)>1e-4){giScale=scale;disposeGITargets();}},
    setGIConeMode:on=>{giConeMode=!!on;giDenoiseCached=false;giHasRecurrent=false;},
    setForceMesh:on=>{forceMesh=on;if(forceMesh)ensureAllBaked();updateMovers(simTime);}};
  document.addEventListener('visibilitychange',resetFps);
  select(selected);
  const urlParams=new URLSearchParams(location.search);
  const initQuality=urlParams.get('quality');
  if(initQuality&&QUALITY_PRESETS[initQuality.toLowerCase()])setQuality(initQuality);
  const initScene=urlParams.get('scene');
  if(initScene==='atrium'||initScene==='gallery')await setScene(initScene);
  renderer.setAnimationLoop(now=>{
    const dt=(animate&&lastNow)?Math.min(now-lastNow,100)/1000:0;
    if(dt>0)simTime+=dt;
    lastNow=now;
    if(animate){
      updateMovers(simTime);
      if(emissiveMode.value&&activeScene==='gallery'&&dt>0)updateEmissiveOrb(emissiveTime+dt,true);
    }
    render(selected);
    if(!started){started=now;return;}
    frames++;
    const elapsed=now-started;
    if(elapsed<500)return;
    fpsValue.textContent=(1000*frames/elapsed).toFixed(0)+' FPS';
    frameMs.textContent=(elapsed/frames).toFixed(1)+' ms / frame';
    started=now;
    frames=0;
  });
} catch(error) {
  status.value=error.message;
  throw error;
}
</script>
